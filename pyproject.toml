[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "xmax-test"
version = "0.3.0"
description = "Production XMAX offline/realtime generation and evaluation pipeline"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5"
]

[project.optional-dependencies]
production = [
  "cos-python-sdk-v5>=1.9.35,<2",
  "static-ffmpeg==3.0"
]

[project.scripts]
xmax-test = "xmax_test.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "C901"]

[tool.ruff.lint.mccabe]
# Coordinators legitimately branch by stage/provider. The previous 33-branch
# streaming function was split; 30 is now the enforced ceiling for adapters.
max-complexity = 30
